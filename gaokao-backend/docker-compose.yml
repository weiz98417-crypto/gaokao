version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gaokao-postgres
    environment:
      POSTGRES_USER: gaokao
      POSTGRES_PASSWORD: gaokao123
      POSTGRES_DB: gaokao
    ports:
      - '5432:5432'
    volumes:
      - gaokao-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gaokao -d gaokao']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  gaokao-postgres-data:
